# aquaman as a credential provider for Agent Substrate's egress gateway.
#
# Apply it to the cluster, then register the provider when installing the
# gateway (see docs/agent-substrate.md):
#
#   --credential-provider='{"name":"aquaman","address":"aquaman-credential-provider.ate-system.svc:50051"}'
#
# Edit the grants in the ConfigMap and create the Secret the Deployment names.
# The image is published with each release; deploy/substrate/Dockerfile builds it
# from the lockfile next to it (docs/agent-substrate.md says how a release moves
# that lockfile).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aquaman-credential-provider
  namespace: ate-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aquaman-credential-provider
  namespace: ate-system
data:
  config.yaml: |
    credentials:
      backend: encrypted-file
    audit:
      # Every fetch is an entry, about 430 bytes. The log is kept in files of
      # 10 MB; this many are kept before the oldest is deleted (about 2.5
      # million entries). Size the volume below to match if you change it.
      maxArchives: 100
    # Nothing in this pod asks the broker for a value; the provider has its own grants.
    broker:
      enabled: false
    substrate:
      provider:
        enabled: true
        tls:
          certFile: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          clientCaFile: /run/podidentity.podcert.ate.dev/trust-bundle.pem
        # <atespace> or <atespace>/<actor> to the references it may be given.
        # Anything not listed is refused. An edit takes effect without a restart.
        grants: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aquaman-credential-provider
  namespace: ate-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquaman-credential-provider
  namespace: ate-system
  labels: {app: aquaman-credential-provider}
spec:
  # One writer for the vault file and the audit log on the volume.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aquaman-credential-provider}
  template:
    metadata:
      labels: {app: aquaman-credential-provider}
    spec:
      serviceAccountName: aquaman-credential-provider
      automountServiceAccountToken: false
      securityContext: {runAsUser: 65532, runAsGroup: 65532, runAsNonRoot: true, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: aquaman
        image: ghcr.io/tech4242/aquaman-credential-provider:0.22.0
        envFrom:
        # AQUAMAN_ENCRYPTION_PASSWORD for the encrypted-file backend, or
        # VAULT_ADDR and VAULT_TOKEN for HashiCorp Vault.
        - secretRef: {name: aquaman-credential-provider}
        ports:
        - {name: grpc, containerPort: 50051}
        readinessProbe:
          tcpSocket: {port: grpc}
          periodSeconds: 5
        # The daemon keeps running when the provider's listener cannot start
        # (certificate files missing, a setting it refuses). Restarting the
        # pod makes that visible and picks up a mount that was late.
        livenessProbe:
          tcpSocket: {port: grpc}
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {memory: 512Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        volumeMounts:
        - {name: state, mountPath: /aqm}
        - {name: config, mountPath: /etc/aquaman, readOnly: true}
        - {name: tmp, mountPath: /tmp}
        - {name: servicedns, mountPath: /run/servicedns.podcert.ate.dev, readOnly: true}
        - {name: podidentity, mountPath: /run/podidentity.podcert.ate.dev, readOnly: true}
      volumes:
      # The vault file (encrypted-file backend) and the audit log.
      - name: state
        persistentVolumeClaim: {claimName: aquaman-credential-provider}
      - name: config
        configMap: {name: aquaman-credential-provider}
      - name: tmp
        emptyDir: {}
      # The serving certificate for aquaman-credential-provider.ate-system.svc,
      # issued and renewed by Substrate; the gateway checks it against the
      # service-DNS trust bundle.
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # The authority the gateway's client certificate chains to.
      - name: podidentity
        projected:
          sources:
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: aquaman-credential-provider
  namespace: ate-system
spec:
  type: ClusterIP
  selector: {app: aquaman-credential-provider}
  ports:
  - {name: grpc, port: 50051, targetPort: grpc, protocol: TCP}
---
# ate-system refuses ingress by default; admit only the egress gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aquaman-credential-provider
  namespace: ate-system
spec:
  podSelector:
    matchLabels: {app: aquaman-credential-provider}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: atenet-egress}
    ports:
    - {protocol: TCP, port: 50051}
