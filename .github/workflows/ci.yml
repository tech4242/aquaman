name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Agent-host pins are deliberate, never dependabot-driven (see ROADMAP:
  # agent-host dependabot policy). OpenClaw is pinned separately per job.
  # Hermes stopped publishing to PyPI after 0.19.0 (hermes-agent PR #68217);
  # current releases are calendar-versioned git tags that refuse wheel
  # builds, so CI tests the last PyPI build and the pinned tag, editable.
  HERMES_PYPI_VERSION: "0.19.0"
  HERMES_REF: "v2026.9.21"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Cache npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install npm dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild keytar esbuild oxlint
      # Block the build only on vulnerabilities in dependencies we actually
      # ship (proxy/plugin/coder). Dev/test-only deps (vitest/vite/esbuild,
      # kdbxweb/argon2 for the KeePassXC tests) never reach a published tarball.
      # The openclaw gateway is NOT in the lockfile at all since v0.15.0 — the
      # e2e job installs it out-of-tree per lane, so its shrinkwrapped tree
      # never shows up in these audits.
      - name: npm audit — block on high+ in shipped deps
        run: npm audit --omit=dev --audit-level=high
      # Surface dev-dependency advisories for awareness, without blocking.
      - name: npm audit — dev deps (informational)
        run: npm audit --audit-level=high || true
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Cache npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install npm dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild keytar esbuild oxlint
      - run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Cache npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install npm dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild keytar esbuild oxlint
      - run: npm run test:coverage
      - name: Upload coverage to Codecov
        # Dependabot-triggered runs get no repo secrets, so the upload can only
        # fail there — skip it (tests above still run and gate the PR).
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  e2e-openclaw:
    name: E2E OpenClaw Plugin (${{ matrix.openclaw }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Host-compat lanes. extended-stable is the conservative line users
        # sit on; the second lane tracks the OpenClaw 2.0 (2026.8.1+) line at
        # the newest release clawstat.us doesn't flag (9.4 is "skip"). Bumps
        # are manual compat events — see .github/dependabot.yml.
        openclaw: ['2026.7.33', '2026.9.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Cache npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install npm dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild keytar esbuild oxlint
      - name: Cache openclaw global install
        id: cache-openclaw
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/node_modules/openclaw
            /usr/local/lib/node_modules/@openclaw
            /usr/local/bin/openclaw
          key: openclaw-v2-${{ runner.os }}-node24-${{ matrix.openclaw }}
      - name: Install openclaw
        if: steps.cache-openclaw.outputs.cache-hit != 'true'
        run: |
          npm install -g openclaw@${{ matrix.openclaw }} --ignore-scripts
          npm rebuild -g openclaw
          # 2026.7.33's npm-shrinkwrap.json omits its own @openclaw/ai
          # dependency, so doctor/agent paths die with "Cannot find package
          # '@openclaw/ai'" (openclaw/openclaw#151657). Install the matching
          # version next to it when it's missing; a no-op once upstream fixes it.
          ROOT="$(npm root -g)"
          if node -e "const d=require('$ROOT/openclaw/package.json').dependencies||{}; process.exit(d['@openclaw/ai'] ? 0 : 1)" \
             && [ ! -d "$ROOT/openclaw/node_modules/@openclaw/ai" ] && [ ! -d "$ROOT/@openclaw/ai" ]; then
            npm install -g "@openclaw/ai@${{ matrix.openclaw }}" --ignore-scripts
          fi
      - name: Assert the lane's gateway version
        run: openclaw --version | grep -F "${{ matrix.openclaw }}"
      - run: npx vitest run test/e2e/openclaw-plugin.test.ts
        env:
          OPENCLAW_BIN: openclaw

      - name: Install plugin for security audit
        run: |
          # Build the plugin (manifest now points at ./dist/index.js)
          npm run build -w aquaman-plugin

          rm -rf ~/.openclaw/extensions/aquaman-plugin
          mkdir -p ~/.openclaw/extensions/aquaman-plugin
          cp packages/plugin/package.json ~/.openclaw/extensions/aquaman-plugin/
          cp packages/plugin/openclaw.plugin.json ~/.openclaw/extensions/aquaman-plugin/
          cp -r packages/plugin/dist ~/.openclaw/extensions/aquaman-plugin/dist

          # Link local proxy build (aquaman-proxy@0.11.0 isn't published yet)
          mkdir -p ~/.openclaw/extensions/aquaman-plugin/node_modules/.bin
          ln -sf $(pwd)/packages/proxy ~/.openclaw/extensions/aquaman-plugin/node_modules/aquaman-proxy
          ln -sf $(pwd)/node_modules/.bin/aquaman ~/.openclaw/extensions/aquaman-plugin/node_modules/.bin/aquaman

          # Install remaining deps (undici etc.)
          cd ~/.openclaw/extensions/aquaman-plugin && npm install --omit=dev --silent --legacy-peer-deps

          # Write openclaw.json with plugin allowlist (but no tools.profile —
          # that's the operator's choice, not ours to impose)
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "plugins": {
              "allow": ["aquaman-plugin"],
              "entries": {
                "aquaman-plugin": {
                  "enabled": true,
                  "config": {
                    "backend": "encrypted-file",
                    "services": ["anthropic", "openai"]
                  }
                }
              }
            }
          }
          EOF

      - name: OpenClaw security audit
        run: |
          OUTPUT=$(openclaw security audit --deep 2>&1) || true
          echo "$OUTPUT"

          # Filter to aquaman-plugin findings only
          AQUAMAN_FINDINGS=$(echo "$OUTPUT" | grep -i "aquaman-plugin" || true)

          if [ -z "$AQUAMAN_FINDINGS" ]; then
            echo "No aquaman-plugin findings"
            exit 0
          fi

          # Expected findings (not aquaman code issues):
          # 1. dangerous-exec on proxy-manager.ts — true positive, plugin spawns proxy process
          # 2. tools_reachable_permissive_policy — environment advisory, not a code vulnerability;
          #    operator chooses their own tools.profile, aquaman should not force "coding" mode
          UNEXPECTED=$(echo "$AQUAMAN_FINDINGS" \
            | grep -v -e "dangerous-exec.*proxy-manager" \
            | grep -v -e "code_safety.*dangerous code patterns" \
            | grep -v -e "tools_reachable_permissive_policy" \
            | grep -v -e "Enabled extension plugins:" \
            | grep -v -e "permissive tool policy" \
            || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "UNEXPECTED scanner findings:"
            echo "$UNEXPECTED"
            exit 1
          fi

          echo "Only expected findings: dangerous-exec on proxy-manager.ts, tools_reachable_permissive_policy (env advisory)"

  e2e-hermes:
    name: Hermes Python plugin (${{ matrix.hermes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hermes: ['pypi', 'tag']
    steps:
      - uses: actions/checkout@v7
      - name: Check out hermes-agent at the pinned tag
        if: matrix.hermes == 'tag'
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent-src
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run aquaman-hermes plugin tests
        working-directory: packages/hermes
        run: uv run --with pytest python -m pytest tests/ -q

      - name: Run Hermes secret-source conformance kit (real hermes-agent)
        working-directory: packages/hermes
        # tests/test_conformance.py self-skips without hermes-agent, so the
        # step above stays dependency-free. This one installs the real host
        # and runs Hermes' own kit against our SecretSource — the upstream
        # "review bar" for a contract-compliant backend. Pinned so a host
        # release changes this job deliberately, not silently.
        run: |
          if [ "${{ matrix.hermes }}" = "tag" ]; then
            HOST=(--with-editable ../../hermes-agent-src)
          else
            HOST=(--with "hermes-agent==${{ env.HERMES_PYPI_VERSION }}")
          fi
          uv run --with pytest "${HOST[@]}" python -m pytest tests/test_conformance.py -q
