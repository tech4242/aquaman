name: CD

# Publishes aquaman to npm, PyPI, and ClawHub when a GitHub release is published.
# A version gate runs first: every version field + inter-package dep pin must
# equal the release tag, or nothing publishes.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate versions match the release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"          # v0.13.0 -> 0.13.0
          echo "Release tag version: $TAG"
          # Source of truth is the tag: stamp every version field from it, so a
          # forgotten manual bump can't block or mis-version a release.
          node scripts/set-version.mjs "$TAG"
          # The asserts below now GUARD the setter — they only fail if a NEW
          # version field was added to the repo without being added to
          # scripts/set-version.mjs. (Kept intentionally — cheap insurance.)
          fail=0
          assert() { # name, actual
            if [ "$2" != "$TAG" ]; then echo "::error::$1 = '$2' (expected '$TAG')"; fail=1
            else echo "ok  $1 = $2"; fi
          }
          assert "root package.json"          "$(jq -r .version package.json)"
          assert "proxy package.json"         "$(jq -r .version packages/proxy/package.json)"
          assert "plugin package.json"        "$(jq -r .version packages/plugin/package.json)"
          assert "coder package.json"         "$(jq -r .version packages/coder/package.json)"
          assert "openclaw.plugin.json"       "$(jq -r .version packages/plugin/openclaw.plugin.json)"
          assert "plugin->aquaman-proxy dep"  "$(jq -r '.dependencies["aquaman-proxy"]' packages/plugin/package.json)"
          assert "coder->aquaman-proxy dep"   "$(jq -r '.dependencies["aquaman-proxy"]' packages/coder/package.json)"
          assert "provider manifest image"    "$(sed -nE 's#^[[:space:]]*image:[[:space:]]*ghcr\.io/tech4242/aquaman-credential-provider:(.*)$#\1#p' deploy/substrate/aquaman-credential-provider.yaml)"
          assert "pyproject.toml"             "$(python3 -c "import tomllib;print(tomllib.load(open('packages/hermes/pyproject.toml','rb'))['project']['version'])")"
          assert "hermes plugin.yaml"         "$(grep -E '^version:' packages/hermes/aquaman_hermes/plugin.yaml | sed -E 's/^version:[[:space:]]*"?([^"]*)"?/\1/')"
          assert "hermes __init__.py"         "$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' packages/hermes/aquaman_hermes/__init__.py)"
          if [ "$fail" = 1 ]; then echo "::error::version mismatch — aborting release"; exit 1; fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  npm-publish:
    name: Publish to npm (proxy -> plugin -> coder)
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild keytar esbuild oxlint
      - run: node scripts/set-version.mjs "${{ needs.validate-version.outputs.version }}"   # stamp versions from the tag
      - run: npm run build
      - run: npm test            # ship only what passes
      # Order matters: proxy first — plugin & coder pin it at an exact version.
      # Each publish runs its own prepublishOnly (clean && build), so dist is fresh.
      # Trusted Publishing: no token. npm exchanges this job's OIDC identity for a
      # short-lived publish credential, which needs npm >= 11.5.1. Each package's
      # trusted publisher on npmjs.com must name tech4242/aquaman + cd.yml.
      - name: npm supports Trusted Publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          printf '%s\n' 11.5.1 "$v" | sort -V -C || { echo "::error::npm $v < 11.5.1, no Trusted Publishing"; exit 1; }
      - run: npm publish --workspace=aquaman-proxy --access public --provenance
      - run: npm publish --workspace=aquaman-plugin --access public --provenance
      - run: npm publish --workspace=aquaman-coder --access public --provenance

  pypi-publish:
    name: Publish to PyPI (aquaman-hermes)
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write            # PyPI Trusted Publishing (no token needed)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test before publish
        working-directory: packages/hermes
        run: uv run --with pytest python -m pytest tests/ -q
      - name: Stamp version from the release tag
        run: node scripts/set-version.mjs "${{ needs.validate-version.outputs.version }}"
      - name: Build sdist + wheel
        working-directory: packages/hermes
        run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/hermes/dist

  clawhub-publish:
    name: Publish to ClawHub (plugin only)
    needs: [validate-version, npm-publish]   # plugin's aquaman-proxy dep must be on npm first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild keytar esbuild oxlint
      - run: node scripts/set-version.mjs "${{ needs.validate-version.outputs.version }}"   # stamp versions from the tag
      - name: Pin npm install integrity into plugin metadata
        # OpenClaw warns when openclaw.install.npmSpec/expectedIntegrity are
        # missing from a ClawHub package. The npm publish job upstream of this
        # one has already published the plugin tarball, so its dist.integrity
        # is authoritative here. Best-effort: registry propagation can lag a
        # tag push, and the metadata is advisory — never fail the publish on it.
        run: |
          export VERSION="${{ needs.validate-version.outputs.version }}"
          export INTEGRITY=$(npm view "aquaman-plugin@$VERSION" dist.integrity 2>/dev/null || true)
          if [ -n "$INTEGRITY" ]; then
            node -e "
              const fs = require('fs');
              const p = 'packages/plugin/package.json';
              const pkg = JSON.parse(fs.readFileSync(p, 'utf-8'));
              pkg.openclaw = pkg.openclaw ?? {};
              pkg.openclaw.install = {
                npmSpec: 'aquaman-plugin@' + process.env.VERSION,
                expectedIntegrity: process.env.INTEGRITY,
              };
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            "
            echo "Pinned openclaw.install: aquaman-plugin@$VERSION ($INTEGRITY)"
          else
            echo "::warning::npm view aquaman-plugin@$VERSION dist.integrity returned nothing — publishing without integrity pin"
          fi
      - run: npm run build                     # produce packages/plugin/dist for the bundle
      - run: npm install -g clawhub@latest      # an old CLI gets rejected by the hardened server
      - name: ClawHub login
        # Output suppressed: this repo is public, so Actions logs are
        # world-readable, and login echoes account context on some CLI
        # versions. Actions masks the exact secret but not a partial form.
        run: |
          if ! clawhub login --token "$CLAWHUB_TOKEN" >/dev/null 2>&1; then
            echo "::error::ClawHub login failed (token rejected, expired, or the CLI contract changed)"
            exit 1
          fi
        env: { CLAWHUB_TOKEN: "${{ secrets.CLAWHUB_TOKEN }}" }
      - name: Validate (Plugin Inspector — must be PASS, 0 breakages)
        run: clawhub package validate packages/plugin
      - name: Publish (async-aware)
        run: |
          set -uo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"

          live() {
            curl -s https://clawhub.ai/api/v1/packages/aquaman-plugin \
              | jq -r '.package.latestVersion // empty'
          }

          # Idempotency guard: a re-run after a ClawHub-side stall must not
          # enqueue a duplicate publish attempt.
          if [ "$(live)" = "$VERSION" ]; then
            echo "aquaman-plugin@$VERSION already live on ClawHub — nothing to do."
            exit 0
          fi

          out=$(clawhub package publish packages/plugin \
            --source-repo tech4242/aquaman \
            --source-commit "${{ github.sha }}" \
            --source-ref main \
            --source-path packages/plugin 2>&1) && status=0 || status=$?
          echo "$out"

          if [ "$status" -ne 0 ]; then
            # ClawHub's staged prepublication (openclaw/clawhub#2979, deployed
            # 2026-07-06) made publish ASYNC: the server accepts with
            # {ok:true,status:"pending",attemptId:...} and creates the release
            # later. clawhub CLI <= 0.23.1 cannot parse that SUCCESS response
            # and exits nonzero with exactly this signature. Treat it as
            # accepted and verify by polling; any other error is a real
            # failure.
            if ! grep -q "packageId: invalid value" <<<"$out"; then
              exit "$status"
            fi
            echo "Accepted by ClawHub (async prepublication pending). Polling for the release..."
          fi

          # The security scan decides when the release appears: about an hour
          # for 0.18.2. Poll 90 minutes and fail visibly if the release hasn't
          # materialized — re-running this job later is safe (see idempotency
          # guard above).
          for i in $(seq 1 540); do
            if [ "$(live)" = "$VERSION" ]; then
              echo "aquaman-plugin@$VERSION is live on ClawHub."
              exit 0
            fi
            sleep 10
          done

          echo "::error::ClawHub has not created the $VERSION release yet — the attempt stays queued server-side. Re-run this job later (idempotent), and check: clawhub package moderation-status aquaman-plugin (context: openclaw/clawhub#2984)"
          exit 1
      - name: Reminder — ClawScan is async
        if: success()
        run: |
          echo "Submitted. ClawScan runs server-side."
          echo "Verify manually:  clawhub package moderation-status aquaman-plugin"

  sync-versions:
    name: Open PR to sync repo versions with the release
    # Only needs the authoritative registries — a flaky/stuck ClawHub must not
    # block syncing the repo. If the maintainer already bumped + committed
    # before tagging, the stamp is a no-op and no PR is opened.
    needs: [validate-version, npm-publish, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the release-sync branch
      pull-requests: write      # open the PR (no PAT needed — creating a PR
                                # doesn't bypass branch protection; merging does)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main             # base the bump on current main, not the tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Stamp versions from the release tag
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: node scripts/set-version.mjs "$VERSION"
      - name: Lock the credential provider image to the released package
        # The image's lockfile can name the new aquaman-proxy only once it is
        # on the registry. This becomes the committed lockfile the next
        # release starts from, so it passes the same check as the image build.
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          # A new version answers 404 for some minutes after it is published.
          curl --fail --silent --show-error --location --retry 40 --retry-delay 15 --retry-all-errors \
            -o /dev/null "https://registry.npmjs.org/aquaman-proxy/-/aquaman-proxy-$VERSION.tgz"
          cp deploy/substrate/package-lock.json "$RUNNER_TEMP/image-lock.before.json"
          (cd deploy/substrate && npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund "aquaman-proxy@$VERSION")
          node scripts/check-image-lock.mjs "$RUNNER_TEMP/image-lock.before.json" deploy/substrate/package-lock.json package-lock.json
      - name: Open sync PR (skips if repo is already in sync)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "main is already at $VERSION — nothing to sync."
            exit 0
          fi
          BRANCH="release-sync/$VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "release: sync versions to $VERSION"   # tracked files only; the lockfile above is one
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --base main --head "$BRANCH" \
            --title "release: sync versions to $VERSION" \
            --body "Automated post-publish sync: stamps all version fields to match the released tag \`v$VERSION\`. The published npm/PyPI artifacts already carry this version; merge to keep \`main\` in sync."

  # The site is deployed by Vercel on pushes to main, and a release tag is not
  # one, so without this the docs keep calling the new version unreleased until
  # the next merge. The hook URL is a Vercel Deploy Hook for the main branch;
  # without the secret this job does nothing.
  site-redeploy:
    name: Redeploy the website
    needs: [npm-publish, pypi-publish]
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Call the Vercel deploy hook
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "No VERCEL_DEPLOY_HOOK_URL secret: the site will update on the next merge to main."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
          echo "Site redeploy requested."


  # The three npm tarballs, as the registry serves them, attached to the GitHub
  # release with a signed provenance file. Nothing depends on this job: the
  # packages are already published when it runs, and a failure here blocks
  # nothing. The attestation is made by this workflow run, the one that built
  # and published the tarballs, over their digests as downloaded.
  # Check one:  gh attestation verify aquaman-proxy-<version>.tgz --repo tech4242/aquaman
  release-assets:
    name: Attach signed tarballs to the release
    needs: [validate-version, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write            # upload assets to the release
      id-token: write            # sign the attestation (Sigstore, OIDC)
      attestations: write        # store it with the repository
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the published tarballs
        run: |
          mkdir assets
          for pkg in aquaman-proxy aquaman-plugin aquaman-coder; do
            curl --fail --silent --show-error --location --retry 10 --retry-delay 15 --retry-all-errors \
              -o "assets/$pkg-$VERSION.tgz" "https://registry.npmjs.org/$pkg/-/$pkg-$VERSION.tgz"
          done
          (cd assets && sha256sum ./*.tgz)
      - name: Attest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.tgz
      - name: Upload to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "assets/aquaman-$VERSION.intoto.jsonl"
          gh release upload "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" --clobber

  # The Agent Substrate credential provider as a container image, installed
  # from the lockfile in deploy/substrate. That lockfile is moved to the
  # aquaman-proxy this run published, and scripts/check-image-lock.mjs stops
  # the job if anything else in it moved to a package that is not in a reviewed
  # lockfile. One image per architecture on a runner of that architecture, then
  # one tag that names both by digest. The attestation is made over the digest
  # of that tag.
  # Check one:  gh attestation verify oci://ghcr.io/tech4242/aquaman-credential-provider:<version> --repo tech4242/aquaman
  image-build:
    name: Build the credential provider image (${{ matrix.arch }})
    needs: [validate-version, npm-publish]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write            # push to ghcr.io
    outputs:
      digest_amd64: ${{ steps.push.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.push.outputs.digest_arm64 }}
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/aquaman-credential-provider
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Wait for the package on the registry
        run: |
          # A new version answers 404 for some minutes after it is published.
          curl --fail --silent --show-error --location --retry 40 --retry-delay 15 --retry-all-errors \
            -o /dev/null "https://registry.npmjs.org/aquaman-proxy/-/aquaman-proxy-$VERSION.tgz"
      - name: Lock the image to the released package
        # The committed lockfile pins every package in the image, with
        # aquaman-proxy at the version before this one. Only that entry may
        # move, or an entry may move to what the repository lockfile has.
        run: |
          set -euo pipefail
          cp deploy/substrate/package-lock.json "$RUNNER_TEMP/image-lock.before.json"
          (cd deploy/substrate && npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund "aquaman-proxy@$VERSION")
          test "$(jq -r '.packages["node_modules/aquaman-proxy"].version' deploy/substrate/package-lock.json)" = "$VERSION"
          node scripts/check-image-lock.mjs "$RUNNER_TEMP/image-lock.before.json" deploy/substrate/package-lock.json package-lock.json
      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            -t "$IMAGE:$VERSION-$ARCH" deploy/substrate
          # The image runs what it says: the daemon of this version.
          docker run --rm --entrypoint aquaman "$IMAGE:$VERSION-$ARCH" --version | grep -F "$VERSION"
      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-$ARCH"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION-$ARCH" | sed 's/.*@//')"
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $IMAGE:$VERSION-$ARCH"; exit 1 ;; esac
          echo "digest_$ARCH=$digest" >> "$GITHUB_OUTPUT"

  image-publish:
    name: Publish the credential provider image
    needs: [validate-version, image-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push the tag to ghcr.io
      id-token: write            # sign the attestation (Sigstore, OIDC)
      attestations: write        # store it with the repository
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/aquaman-credential-provider
      AMD64: ${{ needs.image-build.outputs.digest_amd64 }}
      ARM64: ${{ needs.image-build.outputs.digest_arm64 }}
    steps:
      - name: One tag for both architectures
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # By the digests the build jobs pushed, not by tags that could have moved since.
          tags=(-t "$IMAGE:$VERSION")
          # `latest` follows npm: it moves only when this version is the newest there.
          if [ "$(npm view aquaman-proxy dist-tags.latest)" = "$VERSION" ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $IMAGE:$VERSION"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true
