name: Agent Substrate compat

# aquaman as the credential provider of a real Agent Substrate egress gateway,
# on a kind cluster the job creates: the image from deploy/substrate, the
# shipped manifest, and an actor whose request has to arrive with the stored
# key. Runs when the provider, its image or the check itself changes, and once
# a week to notice a base image or toolchain that stopped working.
#
# The Substrate version is pinned: the driver uses Substrate's own e2e helpers,
# so moving to a new version is a change made here on purpose.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/proxy/src/substrate/**'
      - 'packages/proxy/proto/substrate/**'
      - 'deploy/substrate/**'
      - 'scripts/e2e-substrate.sh'
      - 'scripts/e2e-substrate/**'
      - '.github/workflows/substrate-compat.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # v1.0.1. A commit, not the tag: the job runs that repository's build scripts.
  SUBSTRATE_REF: 20778a6dbb01f13024642851bb592bf67c9fec05

jobs:
  e2e:
    name: E2E Agent Substrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tools on the runner
        # Go fetches the toolchain Substrate's go.mod names; kind and ko are
        # built from Substrate's own tool modules by its scripts.
        run: |
          go version
          docker version --format '{{.Server.Version}}'
          kubectl version --client
      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Build
        run: npm run build
      - name: aquaman provider against a live Agent Substrate gateway
        run: scripts/e2e-substrate.sh "$SUBSTRATE_REF"
