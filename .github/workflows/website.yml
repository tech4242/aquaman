name: Website

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths: ['website/**', 'docs/**', 'SECURITY.md', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'SECURITY.md', '.github/workflows/website.yml']

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # page dates come from git history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Every page has a Markdown twin and the index lists it
        run: |
          test -f dist/llms.txt && test -f dist/llms-full.txt && test -f dist/index.md && test -f dist/AGENTS.md
          for page in $(find dist/docs -mindepth 2 -name index.html); do
            slug=${page#dist/}; slug=${slug%/index.html}
            # A version's own index (docs/0.18.0/) has no twin; every page does.
            case "$slug" in docs/[0-9]*.[0-9]*.[0-9]*) [ "${slug#docs/*/}" = "$slug" ] && continue ;; esac
            test -f "dist/$slug.md" || { echo "no Markdown twin for /$slug/"; exit 1; }
            case "$slug" in docs/[0-9]*.[0-9]*.[0-9]*/*) continue ;; esac
            grep -q "/$slug.md" dist/llms.txt || { echo "/$slug.md is not in llms.txt"; exit 1; }
          done

  # The public site is deployed from a release, so it always describes a
  # version people can install. Vercel's own Git deployments are off
  # (website/vercel.json); this job builds here, with full history for the
  # page dates and the version menu, and uploads the result.
  #
  # Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID,
  # and repository variables SITE_URL (the public origin) and
  # VERCEL_DEPLOY=true. Without the variable the job is skipped.
  deploy:
    name: Deploy to Vercel
    if: (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && vars.VERCEL_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse to deploy without a public origin
        run: test -n "$SITE_URL" || { echo "Set the SITE_URL repository variable"; exit 1; }
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
